<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Chess Trainer</title>
  </head>
  <body>
    <main>
      <h1>Personal Chess Trainer</h1>
      <form action="/sync" method="post">
        <button type="submit">Synchronize</button>
      </form>
      {% if games %}
        <ul>
          {% for game in games %}
            <li>
              <a href="/analyses/{{ game.source_id }}">{{ game.opponent }}</a>
              <span>{{ game.result }} · {{ game.speed }} · {{ game.critical_count }} Critical Moments</span>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p>Your games will appear here after the first sync.</p>
      {% endif %}
    </main>
  </body>
</html>
