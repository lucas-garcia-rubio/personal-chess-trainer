[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-chess-trainer"
version = "0.1.0"
description = "A local web application for reviewing a player's chess games."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.1",
    "mypy>=1.11",
    "pytest>=8.3",
]

[project.scripts]
trainer = "trainer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
